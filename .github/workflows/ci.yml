name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: PHP lint & tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint every PHP file (php -l)
        run: |
          set -e
          find . -path ./vendor -prune -o -name '*.php' -print -exec php -l {} \;

      # composer.json is not guaranteed to exist yet on every branch of this
      # repository, so the dependency install and PHPUnit run are skipped
      # gracefully instead of failing when it's absent.
      - name: Install Composer dependencies
        if: hashFiles('composer.json') != ''
        uses: ramsey/composer-install@v3

      - name: Run PHPUnit
        if: hashFiles('composer.json') != ''
        run: vendor/bin/phpunit
